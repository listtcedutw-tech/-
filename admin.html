<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>管理後台</title>
</head>
<body>
    <h2>版主管理後台</h2>
    <div id="loginBox">
        <button onclick="loginAdmin()">使用 Google 帳號登入</button>
    </div>
    <div id="adminContent" style="display:none;">
        <p>登入成功！</p>
        <div id="postsList"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz3ZK24KVPlpkdA74pu1_-nVPYYprxXsc",
            authDomain: "tsvs-8a185.firebaseapp.com",
            projectId: "tsvs-8a185",
            storageBucket: "tsvs-8a185.firebasestorage.app",
            messagingSenderId: "237011206490",
            appId: "1:237011206490:web:d5b0ab160f2004a4853363",
            measurementId: "G-B4W1F961X5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 🛑 請把這裡換成你的真實信箱
        const ADMIN_EMAIL = "listtcedutw@gmail.com";

        window.loginAdmin = function() {
            const provider = new GoogleAuthProvider();
            signInWithRedirect(auth, provider);
        };

        getRedirectResult(auth).then((result) => {
            if (result && result.user) {
                checkUser(result.user);
            }
        }).catch((error) => {
            alert(error.message);
        });

        function checkUser(user) {
            if (user.email === ADMIN_EMAIL) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
            } else {
                alert("權限不足：" + user.email);
            }
        }
    </script>
</body>
</html>
