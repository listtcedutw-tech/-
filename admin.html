<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>版主審核管理後台 - 匿名東工</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #4c4886;
            color: white;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-bar {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-bar h1 { font-size: 18px; }
        .back-home {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .login-card {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-top: 50px;
        }
        .login-card h2 { color: #4c4886; margin-bottom: 10px; }
        .login-card p { font-size: 13px; color: #666; margin-bottom: 20px; }
        .google-btn {
            background: #4285F4;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        #adminContent {
            width: 100%;
            max-width: 700px;
            display: none;
        }
        .post-card {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .post-info {
            font-size: 12px;
            color: #777;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .post-content {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 15px;
            word-break: break-all;
        }
        .action-btns { display: flex; gap: 10px; }
        .action-btns button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-approve { background: #28a745; }
        .btn-reject { background: #dc3545; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>🛡️ 版主審核管理後台</h1>
        <a href="index.html" class="back-home">⬅ 返回首頁</a>
    </div>

    <div class="login-card" id="loginBox">
        <h2>管理員驗證</h2>
        <p>後台已改由版主 Google 帳號嚴格把關。</p>
        <button class="google-btn" onclick="loginAdmin()">🔐 使用 Google 帳號登入驗證</button>
    </div>

    <div id="adminContent">
        <div id="postsList">載入中...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz3ZK24KVPlpkdA74pu1_-nVPYYprxXsc",
            authDomain: "tsvs-8a185.firebaseapp.com",
            projectId: "tsvs-8a185",
            storageBucket: "tsvs-8a185.firebasestorage.app",
            messagingSenderId: "237011206490",
            appId: "1:237011206490:web:d5b0ab160f2004a4853363",
            measurementId: "G-B4W1F961X5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const ADMIN_EMAIL = "listtcedutw@gmail.com";

        // 改用彈出視窗登入，並把可能發生的錯誤直接跳窗顯示
        window.loginAdmin = async function() {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                checkUser(user);
            } catch (error) {
                alert("登入失敗錯誤碼: " + error.code + "\n原因: " + error.message);
            }
        };

        // 自動檢查是否已經登入過
        auth.onAuthStateChanged((user) => {
            if (user) {
                checkUser(user);
            }
        });

        function checkUser(user) {
            if (user.email === ADMIN_EMAIL) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadAdminPosts();
            } else {
                alert("權限不足，此帳號非管理員：" + user.email);
                signOut(auth);
            }
        }

        async function loadAdminPosts() {
            const container = document.getElementById('postsList');
            container.innerHTML = '載入中...';

            try {
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = '<div class="post-card">目前沒有任何貼文。</div>';
                    return;
                }

                let html = '';
                querySnapshot.forEach((documentSnap) => {
                    const post = documentSnap.data();
                    const postId = documentSnap.id;
                    const email = post.userEmail || '未記錄';
                    const code = post.postCode || '無';
                    const time = post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleString() : '剛剛';
                    const isDeleteRequested = post.deleteRequested ? '<span style="color:red; font-weight:bold;">[🚨 有人申請刪除]</span>' : '';

                    html += `
                        <div class="post-card">
                            <div class="post-info">
                                <span>發文者: ${email} | 刪文編號: <b>${code}</b> ${isDeleteRequested}</span>
                                <span>${time}</span>
                            </div>
                            <div class="post-content">${post.content}</div>
                            <div class="action-btns">
                                <button class="btn-approve" onclick="updatePostStatus('${postId}', 'published')">通過/發布</button>
                                <button class="btn-reject" onclick="deletePost('${postId}')">直接刪除</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                alert("讀取貼文失敗: " + error.message);
                container.innerHTML = '<div class="post-card">載入失敗：' + error.message + '</div>';
            }
        }

        window.updatePostStatus = async function(postId, status) {
            try {
                await updateDoc(doc(db, "posts", postId), { status: status, deleteRequested: false });
                alert('✅ 狀態已更新！');
                loadAdminPosts();
            } catch (error) {
                alert('操作失敗：' + error.message);
            }
        };

        window.deletePost = async function(postId) {
            if (confirm('確定要永久刪除這則貼文嗎？')) {
                try {
                    await deleteDoc(doc(db, "posts", postId));
                    alert('🗑️ 貼文已刪除！');
                    loadAdminPosts();
                } catch (error) {
                    alert('刪除失敗：' + error.message);
                }
            }
        };
    </script>
</body>
</html>
