<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員後台 - 東勢高工匿名心事版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #7b78aa 0%, #4c4886 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        .header-bar {
            max-width: 700px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-bar h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .back-home {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }
        .back-home:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        /* 管理員登入保護區塊 */
        .login-box {
            background: #ffffff;
            color: #333;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
            margin: 80px auto;
        }
        .login-box h2 {
            margin-bottom: 15px;
            font-size: 20px;
            color: #4c4886;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .login-box button {
            width: 100%;
            background: #4c4886;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-box button:hover {
            background: #3b386b;
        }

        /* 後台主介面 */
        .admin-content {
            display: none;
        }

        /* 狀態大分類篩選導覽列 */
        .status-filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .status-filter-bar::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }
        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        .filter-btn.active {
            background: #ffffff;
            color: #4c4886;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        /* 貼文卡片 */
        .post-card {
            background: #ffffff;
            color: #333333;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-left: 5px solid #4c4886;
        }
        .post-card.has-delete-request {
            border-left: 5px solid #dc3545;
            background: #fff8f8;
        }
        .post-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            flex-wrap: wrap;
            gap: 5px;
        }
        .post-content {
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 15px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.85;
        }
        .btn-pending { background: #ffc107; color: #333; }
        .btn-publish { background: #28a745; color: white; }
        .btn-reject { background: #dc3545; color: white; }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge.published { background: #d4edda; color: #155724; }
        .badge.unpublished { background: #fff3cd; color: #856404; }
        .badge.rejected { background: #f8d7da; color: #721c24; }
        .badge.delete-req { background: #f5c6cb; color: #721c24; border: 1px dashed #dc3545; }
        
        .category-badge {
            background: #e2e8f0;
            color: #4c4886;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
            margin-right: 6px;
        }

        .no-data {
            text-align: center;
            color: #ffffff;
            opacity: 0.8;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            backdrop-filter: blur(5px);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-box" id="loginBox">
        <h2>🛡️ 版主後台驗證</h2>
        <input type="password" id="adminPassword" placeholder="請輸入版主後台密碼">
        <button onclick="verifyAdmin()">進入後台</button>
    </div>

    <div class="admin-content" id="adminContent">
        <div class="header-bar">
            <h1>🛡️ 版主審核管理後台</h1>
            <a href="index.html" class="back-home">⬅ 返回首頁</a>
        </div>

        <div class="container">
            <div class="status-filter-bar">
                <button class="filter-btn active" onclick="filterStatus('all', this)">全部貼文</button>
                <button class="filter-btn" onclick="filterStatus('pending', this)">⏳ 審核中</button>
                <button class="filter-btn" onclick="filterStatus('published', this)">🌍 已發布</button>
                <button class="filter-btn" onclick="filterStatus('rejected', this)">🚫 已下架</button>
                <button class="filter-btn" onclick="filterStatus('delete_requested', this)" style="background: rgba(220, 53, 69, 0.4);">🗑️ 刪除申請</button>
            </div>

            <div id="adminPostsContainer">
                <div class="no-data">正在載入貼文資料...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz3ZK24KVPlpkdA74pu1_-nVPYYprxXsc",
            authDomain: "tsvs-8a185.firebaseapp.com",
            projectId: "tsvs-8a185",
            storageBucket: "tsvs-8a185.firebasestorage.app",
            messagingSenderId: "237011206490",
            appId: "1:237011206490:web:d5b0ab160f2004a4853363",
            measurementId: "G-B4W1F961X5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allPostsData = [];
        let currentStatusFilter = 'all';

        window.verifyAdmin = function() {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === "Eason0413") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadAllPostsForAdmin();
            } else {
                alert('密碼錯誤！');
            }
        };

        async function loadAllPostsForAdmin() {
            const container = document.getElementById('adminPostsContainer');
            try {
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                allPostsData = [];
                querySnapshot.forEach((document) => {
                    const postData = document.data();
                    
                    // 🔍 [除錯用] 在 F12 主控台印出每篇貼文的完整資料結構，幫你檢查欄位
                    console.log(`貼文 ID: ${document.id}`, postData);

                    // 寬鬆判定：只要以下任何一個屬性為 true 或符合刪除申請，就視為刪除申請
                    let hasDeleteReq = postData.deleteRequested === true || 
                                       postData.status === 'delete_requested' || 
                                       postData.isDeleteRequested === true ||
                                       postData.requestDelete === true;

                    let status = postData.status;
                    if (!status) {
                        if (hasDeleteReq) status = 'rejected';
                        else if (postData.published) status = 'published';
                        else status = 'pending';
                    }

                    allPostsData.push({
                        id: document.id,
                        ...postData,
                        normalizedStatus: status,
                        deleteRequested: hasDeleteReq
                    });
                });

                renderPosts();
            } catch (error) {
                container.innerHTML = `<div class="no-data">載入失敗：${error.message}</div>`;
            }
        }

        window.filterStatus = function(statusType, btnElement) {
            currentStatusFilter = statusType;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderPosts();
        }

        function renderPosts() {
            const container = document.getElementById('adminPostsContainer');
            
            let filteredPosts = allPostsData;
            if (currentStatusFilter === 'delete_requested') {
                filteredPosts = allPostsData.filter(post => post.deleteRequested === true);
            } else if (currentStatusFilter !== 'all') {
                filteredPosts = allPostsData.filter(post => post.normalizedStatus === currentStatusFilter);
            }

            if (filteredPosts.length === 0) {
                let statusName = '此狀態';
                if (currentStatusFilter === 'pending') statusName = '「審核中」';
                if (currentStatusFilter === 'published') statusName = '「已發布」';
                if (currentStatusFilter === 'rejected') statusName = '「已下架」';
                if (currentStatusFilter === 'delete_requested') statusName = '「刪除申請」';
                container.innerHTML = `<div class="no-data">目前沒有${statusName}的貼文。</div>`;
                return;
            }

            let html = '';
            filteredPosts.forEach((post) => {
                const postId = post.id;
                const timeStr = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString() : '時間未知';
                const status = post.normalizedStatus;
                const userEmail = post.userEmail || post.deleteUserEmail || '未知發文者';
                const category = post.category || '未分類';
                const isDeleteReq = post.deleteRequested;

                let badgeHtml = '';
                if (isDeleteReq) {
                    badgeHtml = `<span class="badge delete-req">⚠️ 申請刪除中</span>`;
                } else if (status === 'rejected') {
                    badgeHtml = `<span class="badge rejected">🚫 已下架</span>`;
                } else if (status === 'published') {
                    badgeHtml = `<span class="badge published">🌍 已發布</span>`;
                } else {
                    badgeHtml = `<span class="badge unpublished">⏳ 審核中</span>`;
                }

                const cardClass = isDeleteReq ? 'post-card has-delete-request' : 'post-card';

                html += `
                    <div class="${cardClass}" id="card-${postId}">
                        <div class="post-info">
                            <div>
                                <span class="category-badge">📌 ${escapeHtml(category)}</span>
                                <span>📧 ${escapeHtml(userEmail)}</span>
                            </div>
                            <div>
                                <span style="margin-right: 8px;">🕒 ${timeStr}</span>
                                ${badgeHtml}
                            </div>
                        </div>
                        <div class="post-content">${escapeHtml(post.content)}</div>
                        <div class="action-buttons">
                            <button class="btn btn-pending" onclick="updatePostStatus('${postId}', 'pending')">設為審核中</button>
                            <button class="btn btn-publish" onclick="updatePostStatus('${postId}', 'published')">發布</button>
                            <button class="btn btn-reject" onclick="updatePostStatus('${postId}', 'rejected')">標記已下架</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        window.updatePostStatus = async function(postId, newStatus) {
            try {
                const postRef = doc(db, "posts", postId);
                let updateData = { status: newStatus };
                
                if (newStatus === 'published') {
                    updateData.published = true;
                    updateData.deleteRequested = false;
                } else if (newStatus === 'rejected') {
                    updateData.published = false;
                    updateData.deleteRequested = true;
                } else {
                    updateData.published = false;
                    updateData.deleteRequested = false;
                }

                await updateDoc(postRef, updateData);
                alert(`已成功將狀態更新為：${newStatus === 'published' ? '已發布' : newStatus === 'rejected' ? '已下架' : '審核中'}`);
                
                const target = allPostsData.find(p => p.id === postId);
                if (target) {
                    target.status = newStatus;
                    target.normalizedStatus = newStatus;
                    target.published = updateData.published;
                    target.deleteRequested = updateData.deleteRequested;
                }
                renderPosts();
            } catch (error) {
                alert('更新狀態失敗：' + error.message);
            }
        };

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
