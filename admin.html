<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>版主審核管理後台 - 匿名東工</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #4c4886;
            color: white;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-bar {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-bar h1 { font-size: 18px; }
        .back-home {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .login-card {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-top: 50px;
        }
        .login-card h2 { color: #4c4886; margin-bottom: 10px; }
        .login-card p { font-size: 13px; color: #666; margin-bottom: 20px; }
        .google-btn {
            background: #4285F4;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        #adminContent {
            width: 100%;
            max-width: 700px;
            display: none;
        }
        .post-card {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>🛡️ 版主審核管理後台</h1>
        <a href="index.html" class="back-home">⬅ 返回首頁</a>
    </div>

    <div class="login-card" id="loginBox">
        <h2>管理員驗證</h2>
        <p>後台已改由版主 Google 帳號嚴格把關。</p>
        <button class="google-btn" onclick="loginAdmin()">🔐 使用 Google 帳號登入驗證</button>
    </div>

    <div id="adminContent">
        <div id="postsList">載入中...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz3ZK24KVPlpkdA74pu1_-nVPYYprxXsc",
            authDomain: "tsvs-8a185.firebaseapp.com",
            projectId: "tsvs-8a185",
            storageBucket: "tsvs-8a185.firebasestorage.app",
            messagingSenderId: "237011206490",
            appId: "1:237011206490:web:d5b0ab160f2004a4853363",
            measurementId: "G-B4W1F961X5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 🛑 請把這裡換成你的真實信箱
        const ADMIN_EMAIL = "listtcedutw@gmail.com";

        window.loginAdmin = function() {
            const provider = new GoogleAuthProvider();
            signInWithRedirect(auth, provider);
        };

        getRedirectResult(auth).then((result) => {
            if (result && result.user) {
                checkUser(result.user);
            }
        }).catch((error) => {
            alert(error.message);
        });

        function checkUser(user) {
            if (user.email === ADMIN_EMAIL) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                document.getElementById('postsList').innerHTML = '登入成功！';
            } else {
                alert("權限不足：" + user.email);
            }
        }
    </script>
</body>
</html>
