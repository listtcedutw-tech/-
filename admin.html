<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>版主審核管理後台 - 匿名東工</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #4c4886;
            color: white;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-bar {
            width: 100%;
            max-width: 750px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-bar h1 { font-size: 18px; }
        .back-home {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        /* 登入卡片 */
        .login-card {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-top: 50px;
        }
        .login-card h2 { color: #4c4886; margin-bottom: 10px; }
        .login-card p { font-size: 13px; color: #666; margin-bottom: 20px; }
        .google-btn {
            background: #4285F4;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        /* 後台主區域 */
        #adminContent {
            width: 100%;
            max-width: 750px;
            display: none;
        }
        /* 分類標籤切換列 */
        .tab-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .tab-btn.active {
            background: white;
            color: #4c4886;
        }
        /* 貼文卡片樣式 */
        .post-card {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .post-info {
            font-size: 12px;
            color: #777;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .post-content {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 15px;
            word-break: break-all;
        }
        .action-btns { display: flex; gap: 10px; }
        .action-btns button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-approve { background: #28a745; }
        .btn-reject { background: #ffc107; color: #333; } /* 下架移至欄位 */
        .btn-delete { background: #dc3545; } /* 永久刪除 */
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>🛡️ 版主審核管理後台</h1>
        <a href="index.html" class="back-home">⬅ 返回首頁</a>
    </div>

    <!-- 登入卡片 -->
    <div class="login-card" id="loginBox">
        <h2>管理員驗證</h2>
        <p>後台已改由版主 Google 帳號嚴格把關。</p>
        <button class="google-btn" onclick="loginAdmin()">🔐 使用 Google 帳號登入驗證</button>
    </div>

    <!-- 後台內容區塊 -->
    <div id="adminContent">
        <!-- 分類切換按鈕 -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tabPending" onclick="switchTab('pending')">⏳ 審核中</button>
            <button class="tab-btn" id="tabPublished" onclick="switchTab('published')">✅ 已發布</button>
            <button class="tab-btn" id="tabRejected" onclick="switchTab('rejected')">📁 已下架欄位</button>
        </div>

        <!-- 貼文列表顯示區 -->
        <div id="postsList">載入中...</div>
    </div>

    <!-- Firebase 邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz3ZK24KVPlpkdA74pu1_-nVPYYprxXsc",
            authDomain: "tsvs-8a185.firebaseapp.com",
            projectId: "tsvs-8a185",
            storageBucket: "tsvs-8a185.firebasestorage.app",
            messagingSenderId: "237011206490",
            appId: "1:237011206490:web:d5b0ab160f2004a4853363",
            measurementId: "G-B4W1F961X5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const ADMIN_EMAIL = "listtcedutw@gmail.com";
        let currentTab = 'pending'; // 預設顯示審核中
        let allPostsData = [];

        window.loginAdmin = async function() {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("登入失敗: " + error.message);
            }
        };

        auth.onAuthStateChanged((user) => {
            if (user) {
                if (user.email === ADMIN_EMAIL) {
                    document.getElementById('loginBox').style.display = 'none';
                    document.getElementById('adminContent').style.display = 'block';
                    loadAdminPosts();
                } else {
                    alert("權限不足，此帳號非管理員：" + user.email);
                }
            }
        });

        // 切換分頁
        window.switchTab = function(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(tabName === 'pending') document.getElementById('tabPending').classList.add('active');
            if(tabName === 'published') document.getElementById('tabPublished').classList.add('active');
            if(tabName === 'rejected') document.getElementById('tabRejected').classList.add('active');
            renderPosts();
        };

        // 載入所有貼文資料
        async function loadAdminPosts() {
            const container = document.getElementById('postsList');
            container.innerHTML = '載入中...';

            try {
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                allPostsData = [];
                querySnapshot.forEach((documentSnap) => {
                    allPostsData.push({
                        id: documentSnap.id,
                        ...documentSnap.data()
                    });
                });

                renderPosts();
            } catch (error) {
                container.innerHTML = '<div class="post-card">載入失敗：' + error.message + '</div>';
            }
        }

        // 根據目前分頁過濾並渲染貼文
        function renderPosts() {
            const container = document.getElementById('postsList');
            
            // 過濾貼文狀態 (如果資料庫裡沒有 status 欄位，預設視為 'pending')
            const filtered = allPostsData.filter(post => {
                const status = post.status || 'pending';
                return status === currentTab;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="post-card" style="text-align:center; color:#666;">此分類目前沒有貼文。</div>`;
                return;
            }

            let html = '';
            filtered.forEach((post) => {
                const postId = post.id;
                const email = post.userEmail || '未記錄';
                const code = post.postCode || '無';
                const time = post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleString() : '剛剛';
                const isDeleteRequested = post.deleteRequested ? '<span style="color:red; font-weight:bold;">[🚨 有人申請刪除]</span>' : '';

                let actionButtons = '';
                if (currentTab === 'pending') {
                    actionButtons = `
                        <button class="btn-approve" onclick="updateStatus('${postId}', 'published')">✅ 通過/發布</button>
                        <button class="btn-reject" onclick="updateStatus('${postId}', 'rejected')">📁 移至下架區</button>
                    `;
                } else if (currentTab === 'published') {
                    actionButtons = `
                        <button class="btn-reject" onclick="updateStatus('${postId}', 'rejected')">📁 移至下架區</button>
                        <button class="btn-delete" onclick="permanentDelete('${postId}')">🗑️ 永久刪除</button>
                    `;
                } else if (currentTab === 'rejected') {
                    actionButtons = `
                        <button class="btn-approve" onclick="updateStatus('${postId}', 'pending')">⏳ 移回審核中</button>
                        <button class="btn-delete" onclick="permanentDelete('${postId}')">🗑️ 永久刪除</button>
                    `;
                }

                html += `
                    <div class="post-card">
                        <div class="post-info">
                            <span>發文者: ${email} | 編號: <b>${code}</b> ${isDeleteRequested}</span>
                            <span>${time}</span>
                        </div>
                        <div class="post-content">${post.content}</div>
                        ${post.deleteRequested ? `<p style="color: #dc3545; font-size: 13px; margin-bottom: 10px;"><b>刪除原因:</b> ${post.deleteReason || '無'}</p>` : ''}
                        <div class="action-btns">
                            ${actionButtons}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 改變貼文狀態（發布 / 移至下架區 / 移回審核）
        window.updateStatus = async function(postId, newStatus) {
            try {
                await updateDoc(doc(db, "posts", postId), { status: newStatus, deleteRequested: false });
                alert('✅ 狀態已更新！');
                loadAdminPosts();
            } catch (error) {
                alert('操作失敗：' + error.message);
            }
        };

        // 永久刪除
        window.permanentDelete = async function(postId) {
            if (confirm('確定要將這則貼文永久刪除嗎？此動作無法復原！')) {
                try {
                    await deleteDoc(doc(db, "posts", postId));
                    alert('🗑️ 貼文已永久刪除！');
                    loadAdminPosts();
                } catch (error) {
                    alert('刪除失敗：' + error.message);
                }
            }
        };
    </script>
</body>
</html>
