<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人中心 - 東勢高工匿名心事版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #7b78aa 0%, #4c4886 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        .header-bar {
            max-width: 600px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-bar h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .back-home {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }
        .back-home:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        /* 分類導覽按鈕區塊（與首頁選單風格一致） */
        .profile-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .menu-btn {
            width: 100%;
            background: #ffffff;
            color: #333333;
            padding: 16px 20px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s, color 0.2s;
        }
        .menu-btn:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
        }
        /* 當前選中的分類樣式 */
        .menu-btn.active {
            background: #4c4886;
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
        .menu-btn .arrow {
            color: #888;
            font-size: 14px;
        }
        .menu-btn.active .arrow {
            color: #ffffff;
        }
        /* 登出按鈕微調 */
        .logout-menu-btn {
            background: #ffffff;
            color: #dc3545;
        }
        .logout-menu-btn:hover {
            background: #fff3f3;
            color: #dc3545;
        }

        /* 貼文清單區塊 */
        .post-card {
            background: #ffffff;
            color: #333333;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-left: 5px solid #4c4886;
        }
        .post-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .post-content {
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 5px;
        }
        .badge.published { background: #d4edda; color: #155724; }
        .badge.unpublished { background: #fff3cd; color: #856404; }
        .badge.rejected { background: #f8d7da; color: #721c24; }

        .no-data {
            text-align: center;
            color: #ffffff;
            opacity: 0.8;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            backdrop-filter: blur(5px);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>👤 個人中心</h1>
        <a href="index.html" class="back-home">⬅ 返回首頁</a>
    </div>

    <div class="container">
        <!-- 功能選單按鈕（白色卡片風格） -->
        <div class="profile-menu">
            <button class="menu-btn active" onclick="switchSection('all', event)">
                <span>📋 投稿紀錄</span>
                <span class="arrow">➔</span>
            </button>
            <button class="menu-btn" onclick="switchSection('pending', event)">
                <span>⏳ 審核中（未發布）</span>
                <span class="arrow">➔</span>
            </button>
            <button class="menu-btn" onclick="switchSection('published', event)">
                <span>🌍 已發布</span>
                <span class="arrow">➔</span>
            </button>
            <button class="menu-btn" onclick="switchSection('rejected', event)">
                <span>🚫 已下架 / 遭到退回</span>
                <span class="arrow">➔</span>
            </button>
            <button class="menu-btn logout-menu-btn" onclick="userLogout()">
                <span>🚪 登出帳號</span>
                <span class="arrow">➔</span>
            </button>
        </div>

        <!-- 內容顯示區域 -->
        <div id="postsContainer">
            <div class="no-data">正在載入您的資料...</div>
        </div>
    </div>

    <!-- Firebase SDK 引入與邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz3ZK24KVPlpkdA74pu1_-nVPYYprxXsc",
            authDomain: "tsvs-8a185.firebaseapp.com",
            projectId: "tsvs-8a185",
            storageBucket: "tsvs-8a185.firebasestorage.app",
            messagingSenderId: "237011206490",
            appId: "1:237011206490:web:d5b0ab160f2004a4853363",
            measurementId: "G-B4W1F961X5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUserEmail = null;
        let myPostsData = [];
        let currentFilter = 'all';

        // 檢查使用者登入狀態
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserEmail = user.email;
                loadMyPosts(currentUserEmail);
            } else {
                const localUser = localStorage.getItem('google_user');
                if (localUser) {
                    currentUserEmail = localUser;
                    document.getElementById('postsContainer').innerHTML = '<div class="no-data">目前沒有抓取到線上貼文紀錄</div>';
                } else {
                    alert('請先登入帳號！');
                    window.location.href = 'index.html';
                }
            }
        });

        // 切換選單分類
        window.switchSection = function(filter, event) {
            currentFilter = filter;
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderMyPosts();
        };

        // 從 Firebase 載入屬於該使用者的貼文
        async function loadMyPosts(email) {
            const container = document.getElementById('postsContainer');
            try {
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                myPostsData = [];
                querySnapshot.forEach((document) => {
                    const data = document.data();
                    // 比對使用者的 Email（支援 userEmail 或 deleteUserEmail）
                    if (data.userEmail === email || data.deleteUserEmail === email) {
                        myPostsData.push({ id: document.id, ...data });
                    }
                });

                renderMyPosts();
            } catch (error) {
                container.innerHTML = `<div class="no-data">載入紀錄失敗：${error.message}</div>`;
            }
        }

        // 渲染貼文清單
        function renderMyPosts() {
            const container = document.getElementById('postsContainer');

            let filtered = myPostsData.filter(post => {
                // 統一以 status 欄位判定 ('pending', 'published', 'rejected')
                // 若舊資料沒有 status 欄位，則退回用 published 布林值判斷
                const status = post.status || (post.published ? 'published' : 'pending');

                if (currentFilter === 'pending') return status === 'pending';
                if (currentFilter === 'published') return status === 'published';
                if (currentFilter === 'rejected') return status === 'rejected' || post.deleteRequested === true;
                return true; // 'all' 全部
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-data">這裡目前沒有任何紀錄喔！</div>';
                return;
            }

            let html = '';
            filtered.forEach(post => {
                const timeStr = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString() : '時間未知';
                const status = post.status || (post.published ? 'published' : 'pending');

                let badgeHtml = '';
                if (status === 'rejected' || post.deleteRequested === true) {
                    badgeHtml = `<span class="badge rejected">🚫 已下架 / 遭到退回</span>`;
                } else if (status === 'published') {
                    badgeHtml = `<span class="badge published">🌍 已發布</span>`;
                } else {
                    badgeHtml = `<span class="badge unpublished">⏳ 審核中</span>`;
                }

                html += `
                    <div class="post-card">
                        <div class="post-info">
                            <span>🕒 投稿時間：${timeStr}</span>
                            <span>${badgeHtml}</span>
                        </div>
                        <div class="post-content">${escapeHtml(post.content)}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 登出功能
        window.userLogout = function() {
            if (confirm('確定要登出帳號嗎？')) {
                signOut(auth).then(() => {
                    localStorage.removeItem('google_user');
                    window.location.href = 'index.html';
                }).catch((error) => {
                    localStorage.removeItem('google_user');
                    window.location.href = 'index.html';
                });
            }
        };

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
