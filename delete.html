<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刪文申請 - 匿名東工</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #4c4886;
            color: white;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-bar h1 {
            font-size: 18px;
        }
        .back-home {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .back-home:hover {
            background: rgba(255,255,255,0.35);
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        .form-card {
            background: white;
            color: #333;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .form-card h3 {
            margin-bottom: 8px;
            color: #4c4886;
            font-size: 18px;
        }
        .form-desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #4c4886;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }
        .submit-btn {
            background: #dc3545;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background: #c82333;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>🗑️ 刪文申請</h1>
        <a href="index.html" class="back-home">⬅ 返回首頁</a>
    </div>

    <div class="container">
        <div class="form-card">
            <h3>填寫刪文申請表單</h3>
            <div class="form-desc">
                如果您需要撤下曾經發布的貼文，請填寫以下資訊。版主收到後將會盡快為您審核並下架。
            </div>

            <div class="form-group">
                <label for="postLink">貼文連結 / 內容識別：</label>
                <input type="text" id="postLink" placeholder="請輸入該則貼文的內容...">
            </div>

            <div class="form-group">
                <label for="deleteReason">刪除原因：</label>
                <textarea id="deleteReason" placeholder="請簡述為什麼要申請刪除這則貼文..."></textarea>
            </div>

            <div class="form-group">
                <label for="studentId">您的學號 / 信箱：</label>
                <input type="text" id="studentId" placeholder="例如：112345 或直接打某某老師">
            </div>

            <button class="submit-btn" onclick="submitDeleteRequestForm()">送出刪文申請</button>
        </div>
    </div>

    <!-- 引入 Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz3ZK24KVPlpkdA74pu1_-nVPYYprxXsc",
            authDomain: "tsvs-8a185.firebaseapp.com",
            projectId: "tsvs-8a185",
            storageBucket: "tsvs-8a185.firebasestorage.app",
            messagingSenderId: "237011206490",
            appId: "1:237011206490:web:d5b0ab160f2004a4853363",
            measurementId: "G-B4W1F961X5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.submitDeleteRequestForm = async function() {
            const keyword = document.getElementById('postLink').value.trim();
            const reasonVal = document.getElementById('deleteReason').value.trim();
            const idVal = document.getElementById('studentId').value.trim();

            if (!keyword || !reasonVal || !idVal) {
                alert('請完整填寫所有欄位！');
                return;
            }

            try {
                const postsRef = collection(db, "posts");
                const querySnapshot = await getDocs(postsRef);
                
                let matchedCount = 0;

                // 搜尋所有貼文，只要 ID 符合或是內容包含關鍵字，就標記刪除申請
                for (const documentSnap of querySnapshot.docs) {
                    const postData = documentSnap.data();
                    const content = postData.content || "";

                    if (documentSnap.id === keyword || content.includes(keyword)) {
                        await updateDoc(doc(db, "posts", documentSnap.id), {
                            deleteRequested: true,
                            deleteReason: reasonVal,
                            deleteUserEmail: idVal
                        });
                        matchedCount++;
                    }
                }

                if (matchedCount > 0) {
                    alert(`✅ 成功送出！已對應到 ${matchedCount} 筆貼文的刪除申請，版主後台將會顯示提醒。`);
                } else {
                    alert('⚠️ 找不到符合該關鍵字的貼文，請確認輸入的內容是否正確！');
                    return;
                }
                
                document.getElementById('postLink').value = '';
                document.getElementById('deleteReason').value = '';
                document.getElementById('studentId').value = '';
                window.location.href = 'index.html';

            } catch (error) {
                alert('送出失敗：' + error.message);
            }
        };
    </script>
</body>
</html>
