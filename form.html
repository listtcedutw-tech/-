<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>發送匿名 - 東勢高工匿名心事版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #7b78aa 0%, #4c4886 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        h2 {
            color: #4c4886;
            font-size: 20px;
            margin-bottom: 8px;
            text-align: center;
        }
        p.desc {
            font-size: 13px;
            color: #666;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }
        textarea {
            width: 100%;
            height: 160px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #4c4886;
            box-shadow: 0 0 0 3px rgba(76, 72, 134, 0.15);
        }
        .submit-btn {
            background: #4c4886;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background: #3b376c;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
        }
        .back-link:hover {
            color: #333;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>✉️ 填寫匿名投稿</h2>
        <p class="desc">你想說什麼呢？送出後將同步至匿名版。</p>

        <form id="postForm">
            <div class="form-group">
                <label for="content">投稿內容</label>
                <textarea id="content" placeholder="請在此輸入你的心事或想說的話..." required></textarea>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">確認送出</button>
        </form>

        <a href="index.html" class="back-link">⬅️ 返回首頁</a>
    </div>

    <!-- 引入 Firebase 寫入邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz3ZK24KVPlpkdA74pu1_-nVPYYprxXsc",
            authDomain: "tsvs-8a185.firebaseapp.com",
            projectId: "tsvs-8a185",
            storageBucket: "tsvs-8a185.firebasestorage.app",
            messagingSenderId: "237011206490",
            appId: "1:237011206490:web:d5b0ab160f2004a4853363",
            measurementId: "G-B4W1F961X5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('postForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const content = document.getElementById('content').value.trim();
            const userEmail = localStorage.getItem('google_user') || '未登入或匿名身分';
            const btn = document.getElementById('submitBtn');

            if (!content) {
                alert('請輸入內容！');
                return;
            }

            btn.disabled = true;
            btn.textContent = '傳送中...';

            try {
                // 將資料寫入 Firebase 的 'posts' 集合，並記錄發文者的信箱與時間
                await addDoc(collection(db, "posts"), {
                    content: content,
                    userEmail: userEmail,
                    createdAt: serverTimestamp()
                });

                alert('✅ 投稿成功！');
                window.location.href = 'index.html';
            } catch (error) {
                alert('❌ 投稿失敗，請稍後再試：' + error.message);
                btn.disabled = false;
                btn.textContent = '確認送出';
            }
        });
    </script>

</body>
</html>
