<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信箱驗證登入 - 東勢高工匿名心事版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #7b78aa 0%, #4c4886 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            text-align: center;
        }
        h2 {
            color: #4c4886;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p.desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #555;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .action-btn {
            flex: 1;
            background: #4c4886;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn.secondary {
            background: #f1f3f4;
            color: #3c4043;
            border: 1px solid #dadce0;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
        }
        .back-link:hover {
            color: #333;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔒 校園身分驗證</h2>
        <p class="desc">本站限<strong>東勢高工在校生</strong>使用。<br>首次使用請先註冊，系統將寄送驗證信至您的學校信箱。</p>

        <div class="input-group">
            <label>學校電子郵件 (@tsvs.tc.edu.tw)</label>
            <input type="email" id="emailInput" placeholder="例如：12345678@tsvs.tc.edu.tw">
        </div>
        
        <div class="input-group">
            <label>密碼設定 / 輸入</label>
            <input type="password" id="passwordInput" placeholder="請輸入密碼（至少 6 個字元）">
        </div>

        <div class="btn-container">
            <button class="action-btn secondary" onclick="handleRegister()">註冊新帳號</button>
            <button class="action-btn" onclick="handleLogin()">登入網站</button>
        </div>

        <a href="index.html" class="back-link">⬅️ 返回首頁</a>
    </div>

    <!-- 引入 Firebase 核心與 Auth SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz3ZK24KVPlpkdA74pu1_-nVPYYprxXsc",
            authDomain: "tsvs-8a185.firebaseapp.com",
            projectId: "tsvs-8a185",
            storageBucket: "tsvs-8a185.firebasestorage.app",
            messagingSenderId: "237011206490",
            appId: "1:237011206490:web:d5b0ab160f2004a4853363",
            measurementId: "G-B4W1F961X5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 統一檢查學校信箱格式
        function validateEmail(email) {
            if (!email.endsWith('@tsvs.tc.edu.tw')) {
                alert('❌ 擋駕！本站僅限東勢高工 (@tsvs.tc.edu.tw) 學校信箱使用！');
                return false;
            }
            return true;
        }

        // 1. 註冊邏輯
        window.handleRegister = async function() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            if (!validateEmail(email)) return;
            if (password.length < 6) {
                alert('密碼長度至少需要 6 個字元！');
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                // 發送驗證信
                await sendEmailVerification(userCredential.user);
                alert('✨ 註冊成功！驗證信已寄至您的學校信箱：\n' + email + '\n\n請先前往學校信箱點擊驗證連結，之後才能登入發文！');
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    alert('此學校信箱已經註冊過了，請直接點擊「登入網站」！');
                } else {
                    alert('註冊失敗：' + error.message);
                }
            }
        };

        // 2. 登入邏輯
        window.handleLogin = async function() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            if (!validateEmail(email)) return;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 檢查是否已完成信箱驗證
                await user.reload(); // 重新整理用戶狀態
                if (!user.emailVerified) {
                    alert('⚠️ 您的學校信箱尚未完成驗證！\n請先至學校信箱收信並點擊驗證連結。如果您沒收到信，請重新註冊或檢查垃圾郵件匣。');
                    return;
                }

                // 驗證通過，記錄並跳轉
                localStorage.setItem('google_user', user.email);
                alert('🎉 登入成功！歡迎回來');
                window.location.href = 'form.html';
            } catch (error) {
                alert('登入失敗，請檢查帳號密碼是否正確：' + error.message);
            }
        };
    </script>

</body>
</html>
